name: Release

# Tag-driven signed release pipeline.
#
# Trigger:
#   - Push a tag matching `v*.*.*` (e.g. `v1.0.1`). The job verifies the
#     tag matches the version in pubspec.yaml, then builds + publishes.
#   - Or run manually via workflow_dispatch with a `tag` input — the
#     resulting GitHub Release is created as a draft for review.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of android/app/keystore/balanced-release.jks
#                              (e.g. `base64 -i balanced-release.jks | pbcopy`)
#   ANDROID_KEYSTORE_PASSWORD  storePassword from local android/key.properties
#   ANDROID_KEY_ALIAS          keyAlias (currently `balanced`)
#   ANDROID_KEY_PASSWORD       keyPassword
#
# Outputs (attached to the GitHub Release):
#   - app-release.apk (universal)
#   - app-armeabi-v7a-release.apk
#   - app-arm64-v8a-release.apk
#   - app-x86_64-release.apk
#   - app-release.aab (Play Store ready, even though we sideload today)
#   - SHA256SUMS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1). Created as a draft release."
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify pubspec.yaml version matches tag
        run: |
          set -euo pipefail
          PUBSPEC_VERSION=$(awk -F': ' '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '[:space:]' | cut -d'+' -f1)
          if [[ "$PUBSPEC_VERSION" != "${{ steps.tag.outputs.version }}" ]]; then
            echo "::error::pubspec.yaml version is '$PUBSPEC_VERSION' but tag is '${{ steps.tag.outputs.tag }}'."
            echo "::error::Bump pubspec.yaml to match before tagging."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64. See workflow header for the full secret list."
            exit 1
          fi
          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/balanced-release.jks
          chmod 600 android/app/keystore/balanced-release.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Missing secret $var."
              exit 1
            fi
          done
          umask 077
          cat > android/key.properties <<EOF
          storeFile=keystore/balanced-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk             out/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   out/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      out/
          cp build/app/outputs/bundle/release/app-release.aab          out/
          ( cd out && sha256sum ./*.apk ./*.aab > SHA256SUMS )
          ls -lh out/

      - name: Extract release notes from RELEASE.md
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"
          NOTES_FILE=release_notes.md
          awk -v ver="$VERSION" '
            $0 ~ "^### v"ver"([^0-9]|$)" { found=1; print; next }
            /^### v/ && found { exit }
            found
          ' RELEASE.md > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Release v${VERSION}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "_No matching section found in RELEASE.md — add a \`### v${VERSION}\` heading there to populate notes automatically next time._" >> "$NOTES_FILE"
          fi
          {
            echo ""
            echo "---"
            echo "Built from \`${{ github.sha }}\` by [Release workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Wipe signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -rf android/app/keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Balanced ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          # Manual dispatches land as drafts for review; tag pushes publish
          # immediately since the version check has already vetted them.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            out/app-release.apk
            out/app-armeabi-v7a-release.apk
            out/app-arm64-v8a-release.apk
            out/app-x86_64-release.apk
            out/app-release.aab
            out/SHA256SUMS
