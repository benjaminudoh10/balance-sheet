name: Secret scan

# Two layers of defence against accidentally committing the release
# keystore or its passwords:
#
#   1. `keystore-guard` — a fast, deterministic check that fails the PR
#      if any tracked path matches the patterns gitignored in .gitignore
#      (android/key.properties, android/app/keystore/, *.jks, *.keystore).
#
#   2. `gitleaks` — broad regex / entropy scan over the diff (PRs) or
#      full history (push) for generic secrets (API tokens, JWTs, AWS
#      keys, etc.) that no project-specific guard would catch.

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly full-history sweep so a secret committed long ago and not
    # caught by the per-PR scan still surfaces eventually.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  keystore-guard:
    name: Keystore guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse tracked signing material
        run: |
          set -euo pipefail
          MATCHES=$(git ls-files \
            'android/key.properties' \
            'android/app/keystore/**' \
            '*.jks' \
            '*.keystore' || true)
          if [[ -n "$MATCHES" ]]; then
            echo "::error::The following signing-material paths are tracked by git:"
            printf '  %s\n' $MATCHES
            echo "::error::These paths are gitignored for a reason. Remove them with:"
            echo "::error::  git rm --cached <path> && git commit"
            echo "::error::then ROTATE the leaked keystore/passwords immediately."
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history only on push / scheduled sweep so the PR scan
          # stays fast against the diff.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            gitleaks detect \
              --redact \
              --no-banner \
              --verbose \
              --log-opts="origin/${{ github.base_ref }}..HEAD"
          else
            gitleaks detect \
              --redact \
              --no-banner \
              --verbose
          fi
