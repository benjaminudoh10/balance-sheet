name: PR labeler

# Applies path-based labels (defined in .github/labeler.yml) to every
# pull request so the PR list stays scannable. Uses pull_request_target
# so the labels can also be applied to PRs from forks (the workflow
# definition that runs is always the one on the base branch, never the
# untrusted PR head).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
