name: Prerelease APK

# Builds an unsigned "latest main" APK on every push to main so there is
# always a sideload-able snapshot to share with testers without cutting
# a tag. Distinct from `release.yml`, which produces signed artifacts
# attached to a GitHub Release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build prerelease APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(awk -F': ' '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '[:space:]')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # Built without --release because no signing material is available;
      # `flutter build apk` (default profile/debug) is enough to give
      # testers an installable snapshot of main.
      - name: Build APK
        run: flutter build apk --debug --build-name=${{ steps.version.outputs.version }}-main --build-number=${{ github.run_number }}

      - name: Rename artifact
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk \
            out/balanced-${{ steps.version.outputs.version }}-main-${{ steps.version.outputs.short_sha }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: balanced-main-${{ steps.version.outputs.short_sha }}
          path: out/*.apk
          retention-days: 90
